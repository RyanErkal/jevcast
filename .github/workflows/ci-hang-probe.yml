name: Hang probe (temporary)

on:
  push:
    branches: [cursor/ci-reliability-1c79]

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      JEVCAST_MAIL_OFFLINE: "1"
      JEVCAST_SKIP_LIVE_MAIL_MODEL: "1"
      JEVCAST_SKIP_MAIL_DICTIONARY: "1"
      NSUnbufferedIO: "YES"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v6
        with:
          path: Vendor
          key: ghosttykit-${{ runner.os }}-${{ hashFiles('scripts/ghosttykit.sh', 'scripts/ghosttykit-libtool.patch') }}
          fail-on-cache-miss: true
      - run: scripts/ghosttykit.sh
      - run: swift build --build-tests
      - name: Probe
        run: |
          set +e
          fails=0
          run_once() {
            local name=$1 limit=$2
            shift 2
            "$@" > "/tmp/$name.txt" 2>&1 &
            local pid=$!
            local i=0
            while kill -0 "$pid" 2>/dev/null; do
              i=$((i + 1))
              if [ "$i" -ge "$limit" ]; then
                echo "::error::HANG $name after ${limit}s: $(grep -E 'Test Case .* started' "/tmp/$name.txt" | tail -1)"
                tail -40 "/tmp/$name.txt"
                pkill -9 xctest || true
                kill -9 "$pid" 2>/dev/null || true
                wait "$pid"
                fails=$((fails + 1))
                return
              fi
              sleep 1
            done
            wait "$pid"
            local status=$?
            if [ "$status" -ne 0 ]; then
              echo "::error::$name exited $status"
              grep -E "failed|error:|Fatal|XCTAssert" "/tmp/$name.txt" | tail -40
              tail -30 "/tmp/$name.txt"
              fails=$((fails + 1))
            else
              echo "$name ok $(grep -E 'Executed [0-9]+ tests' "/tmp/$name.txt" | tail -1)"
            fi
          }
          for i in $(seq 1 25); do
            run_once "timeout-$i" 20 swift test --skip-build --filter testTheTimeLimitOfARealProcessMayHaveSent
          done
          run_once full-1 300 swift test --skip-build
          run_once full-2 300 swift test --skip-build
          echo "fails=$fails"
          exit "$fails"
