name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    # NSGlassEffectView needs the macOS 26 SDK, so the runner needs Xcode 26 or later.
    runs-on: macos-26
    # A libghostty build without the cache takes several minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Cache libghostty
        id: ghosttykit
        uses: actions/cache@v4
        with:
          path: Vendor
          key: ghosttykit-${{ runner.os }}-${{ hashFiles('scripts/ghosttykit.sh', 'scripts/ghosttykit-libtool.patch') }}
      - name: libghostty toolchain
        if: steps.ghosttykit.outputs.cache-hit != 'true'
        run: |
          brew install zig@0.15
          xcodebuild -downloadComponent MetalToolchain
      - name: Build libghostty
        run: scripts/ghosttykit.sh
      - name: Test
        run: swift test
      - name: Build the universal app
        run: scripts/build.sh
      - name: Check architectures and signature
        run: |
          BIN="dist/Jevcast.app/Contents/MacOS/JevLauncher"
          for arch in arm64 x86_64; do lipo "$BIN" -verify_arch "$arch"; done
          SDK="$(xcrun --show-sdk-version)"
          test "$(xcrun vtool -show-build "$BIN" | grep -Ec "sdk[[:space:]]+$SDK$")" -eq 2
          codesign --verify --strict "dist/Jevcast.app"
