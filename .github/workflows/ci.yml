name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # NSGlassEffectView needs the macOS 26 SDK, so the runner needs Xcode 26 or later.
    runs-on: macos-26
    # A libghostty build without the cache takes about 12 minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Restore libghostty
        id: ghosttykit
        uses: actions/cache/restore@v4
        with:
          path: Vendor
          key: ghosttykit-${{ runner.os }}-${{ hashFiles('scripts/ghosttykit.sh', 'scripts/ghosttykit-libtool.patch') }}
      - name: libghostty toolchain
        if: steps.ghosttykit.outputs.cache-hit != 'true'
        run: |
          brew install zig@0.15
          xcodebuild -downloadComponent MetalToolchain
      - name: Build libghostty
        run: scripts/ghosttykit.sh
      # Saved before the tests, so a failed test does not throw the build away.
      - name: Save libghostty
        if: steps.ghosttykit.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Vendor
          key: ${{ steps.ghosttykit.outputs.cache-primary-key }}
      - name: Test
        # A hung test fails the job here, not at the job's limit.
        timeout-minutes: 20
        env:
          # Tests use fixtures and must not reach real mail accounts or Apple Mail.
          JEVCAST_MAIL_OFFLINE: "1"
          # A live mail model times out with the runner's Xcode 26; those tests run locally.
          JEVCAST_SKIP_LIVE_MAIL_MODEL: "1"
          # Writes each test line at once, so a cancelled run's log shows the test that hung.
          NSUnbufferedIO: "YES"
        run: swift test
